<article>
<h2>PHP mode</h2>
<form><textarea id="code" name="code">
<?php function hello($who) {
	return "Hello " . $who;
}
?>
<p>The program says = hello("World") ?>.</p>
<script>alert("And here is some JS code"); // also colored</script>
</textarea></form>

    <script>var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
        lineNumbers: true,
        matchBrackets: true,
        mode: "application/x-httpd-php",
        indentUnit: 4,
        indentWithTabs: true,
        enterMode: "keep",
        tabMode: "shift"
      });</script>

    <p>Simple HTML/PHP mode based on
    the <a href="https://tufailyarlok.github.io/SIT_Demo/wp-content/plugins/profile-builder/assets/lib/codemirror/mode/clike/">C-like</a> mode. Depends on XML,
    JavaScript, CSS, HTMLMixed, and C-like modes.</p>

    <p><strong>MIME types defined:</strong> <code>application/x-httpd-php</code> (HTML with PHP code), <code>text/x-php</code> (plain, non-wrapped PHP code).</p>
  </article>
